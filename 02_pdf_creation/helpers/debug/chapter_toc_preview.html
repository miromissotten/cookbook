<style>
    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .recipe-page {
        width: 210mm;
        height: 297mm;
        padding: 25mm 20mm 25mm 30mm;
        box-sizing: border-box;
        background: #ffffff;
        box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        position: relative;
        isolation: isolate;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }
    @page {
        size: A4;
        margin: 0;
    }
    @media print {
        html, body {
            margin: 0;
            padding: 0;
            background: white !important;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        .recipe-page {
            margin: 0;
            box-shadow: none !important;
            border: none;
            page-break-after: always;
            break-after: page;
            page-break-inside: avoid;
        }
        /* Multi-sheet documents stack vertically when printed. */
        main {
            display: block !important;
            padding: 0 !important;
            min-height: 0 !important;
        }
    }
    .toc-flavortree {
        position: relative;
        padding-left: 48px;
    }
    /* ---- CHAPTER SPINE (continuous vertical line) ---- */
    .toc-flavortree::before {
        content: "";
        position: absolute;
        left: 20px;
        top: 0;
        bottom: 0;
        border-left: 2px solid #47664a;
    }
    .toc-chapter-group {
        position: relative;
        margin-bottom: 1.5rem;
    }
    /* Inter-chapter connectors: downward arrow (default) or dotted
       line (chapter 4 sauces) — drawn via inline SVG .toc-connector */
    .toc-connector {
        position: absolute;
        left: -37px;   /* 48px padding - 11px: svg line x=10 lands on spine centre */
        top: -24px;    /* spans the 1.5rem gap between chapter groups */
        width: 20px;
        height: 24px;
        z-index: 2;
        pointer-events: none;
    }
    /* ---- CHAPTER ROW ---- */
    .toc-chapter-row {
        position: relative; /* anchor the ::before fan stub to this row */
        font-family: 'Manrope', sans-serif;
        font-weight: 700;
        font-size: 1.05rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: #2d3432;
        padding: 0.4rem 0.75rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    /* Fan line: horizontal stub from chapter row to spine */
    .toc-chapter-row::before {
        content: "";
        position: absolute;
        left: -28px;
        top: 50%;
        width: 28px;
        border-top: 2px solid #47664a;
        transform: translateY(-50%);
    }
    /* ---- SUBSECTION / ITEM ROWS ---- */
    .toc-row {
        position: relative; /* anchor the ::before fan stub to this row */
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 0.8rem;
        color: #59615f;
        padding: 0.2rem 0.75rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    /* Fan line: horizontal stub from row to spine */
    .toc-row::before {
        content: "";
        position: absolute;
        left: -28px;
        top: 50%;
        width: 28px;
        border-top: 2px solid #47664a;
        transform: translateY(-50%);
    }
    .toc-subsection-list {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
    }
    .toc-subitem-row {
        padding-left: 0.75rem;
    }
    /* Progressive indents for the deep levels of a chapter main page's
       sub-table of contents (x.x.x. and beyond). Placed after
       .toc-subitem-row so the depth class wins the padding-left tie. */
    .toc-depth-3 {
        padding-left: 1.5rem;
    }
    .toc-depth-4 {
        padding-left: 2.25rem;
    }
    .toc-depth-5 {
        padding-left: 3rem;
    }
    /* Chapter intro prose above the chapter's sub-TOC tree */
    .chapter-intro {
        margin-bottom: 1.5rem;
    }
    .toc-page-num {
        min-width: 24px;
        text-align: right;
    }
    .toc-pos {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 500;
        font-size: 0.72rem;
        color: #9b9d9c;
        margin-right: 0.45em;
    }
</style>
